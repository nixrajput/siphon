name: Labeler

# Auto-labels PRs by the paths they touch (config in .github/labeler.yml).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs with the base repo's token. This job never checks
# out or runs PR code: the labeler reads only the changed-file list via the API.
permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

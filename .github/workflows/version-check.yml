name: Version Check

# Every PR must bump the root VERSION file (plain "x.y.z"). A PR that changes
# only the waived paths in the scope step below needs no bump. A release comes
# from a manual v* tag push, not from a merge.
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  version-bumped:
    name: version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base branch to diff the version
          persist-credentials: false
      - name: Read versions
        id: v
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          pr=$(tr -d ' \r\n' < VERSION)
          # If VERSION doesn't exist on the base yet (the PR that introduces it),
          # treat the base as 0.0.0 so any real version passes the bump check.
          base=$(git show "origin/$BASE_REF:VERSION" 2>/dev/null | tr -d ' \r\n' || true)
          base=${base:-0.0.0}
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # Deliberately NOT paths-ignore on the trigger: this job is a required check,
      # so a skipped run leaves the PR pending forever. It always runs, and waives
      # the requirement from inside when nothing that reaches users changed. The
      # list is a denylist so a new path defaults to needing a bump. README.md and
      # LICENSE ship in the release archives, and scripts/install.sh is served
      # from main, so they are absent on purpose.
      - name: Does this PR change anything users receive
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD")
          echo "changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # Counted, not `grep -qv`: the inverted-match exit code varies between
          # grep implementations, and a wrong answer here either blocks every PR
          # or silently waives the gate. Arithmetic means the same thing anywhere.
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          infra=$(printf '%s\n' "$changed" | grep -cE '^(\.github/|\.claude/|\.githooks/|(AGENTS|CLAUDE|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\.md$)' || true)
          echo "total=${total:-0} infra-only=${infra:-0}"
          if [ "${total:-0}" -gt "${infra:-0}" ]; then
            echo "ships=true" >> "$GITHUB_OUTPUT"
          else
            echo "ships=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        env:
          PR: ${{ steps.v.outputs.pr }}
          BASE: ${{ steps.v.outputs.base }}
          SHIPS: ${{ steps.scope.outputs.ships }}
        run: |
          if [ "$SHIPS" != "true" ]; then
            echo "No shipping paths changed; version bump not required."
            exit 0
          fi
          echo "base=$BASE  pr=$PR"
          if [ "$PR" = "$BASE" ]; then
            echo "::error::VERSION not bumped (still $BASE)."
            exit 1
          fi
          greater=$(printf '%s\n%s\n' "$BASE" "$PR" | sort -V | tail -n1)
          if [ "$greater" != "$PR" ]; then
            echo "::error::VERSION $PR is lower than base $BASE."
            exit 1
          fi
          echo "Version bumped $BASE -> $PR ✓"
